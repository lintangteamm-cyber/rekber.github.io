:root[data-theme="dark"]{--bg:#08111F;--app:#0C1626;--surface:#13203A;--surface-2:#1A2A47;--ink:#E8EEF8;--ink-2:#A9B7CC;--ink-3:#8190A8;--line:#26385A;--navy:#2F5FB8;--on-navy:#FFFFFF;--teal:#2EC4B0;--teal-btn:#16A596;--on-teal:#04201C;--teal-ink:#5FE0CF;--teal-soft:#0F3A3A;--accent:#F4A53C;--accent-ink:#FFC978;--accent-soft:#3A2A10;--good:#4FD8A0;--good-soft:#0F3A2C;--bad:#FF8F82;--bad-soft:#3F1B18;--info:#8DB4F5;--info-soft:#142C52;--hero-1:#14336A;--hero-2:#0B5A5C;--frame:#02060D;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}

</style>
<style>

function dayTick(){
 S.day++;
 const t=S.tx;if(!t||t.status==='done')return;
 if(disputeActive(t)){
  const d=t.dispute;
  if(S.scenario==='D'&&!d.sellerFiles.length&&S.day>=d.openedDay+1){d.sellerFiles=SELLER_FILES.slice();ev('Penjual mengunggah bukti sanggahan.','seller');}
  if(S.scenario==='D'&&d.extra&&!d.extraSeller&&S.day>=d.extraAsked+1){d.extraSeller=true;d.sellerFiles.push('tanda-terima-kurir.jpg');ev('Penjual menambahkan bukti: tanda terima kurir.','seller');}
  if(S.day>=d.openedDay+7&&!d.escalated){d.escalated=true;ev('Batas 7 hari kerja terlewati tanpa kesepakatan. Jalur pengaduan lanjutan ke BI terbuka.','sys');toast('Batas 7 hari kerja terlewati. Jalur pengaduan BI terbuka.','warn');}
  return;
 }
 if(t.status==='held'){
  if(S.scenario!=='B'&&S.day>=t.paidDay+1)ship('KKX'+(7300400000+S.seq*7919+S.day*313));
  else if(S.day>=t.paidDay+3)finish('refund_noship');
 }else if(t.status==='shipped'){
  if(t.resiFlag){if(S.day>=t.shippedDay+3)finish('refund_resi');return;}
  if(t.deliveredDay==null){if(S.day>=t.shippedDay+2){t.deliveredDay=S.day;ev('Resi kurir: paket diterima di alamat tujuan.','sys');S.fx=true;toast('Resi menunjukkan paket diterima');}}
  else if(S.day>=t.deliveredDay+3)finish('auto_release');
 }
}

 return{label:'Perkiraan barang tiba',day:t.shippedDay+2,total:2,start:t.shippedDay,hint:'Pembeli dapat mengonfirmasi kapan saja setelah barang diterima.'};

const LBL={release:'Cairkan ke penjual',refund:'Kembalikan ke pembeli',more:'Minta bukti tambahan'};
function aiDispute(t){
 const d=t.dispute,b=d.buyerFiles.length,s=d.sellerFiles.length,rs=[],sig=t.signals.slice();let sug='more',conf=50;
 rs.push('Keberatan pembeli: “'+d.reason+'”, dengan '+b+' bukti terlampir.');
 rs.push(s?'Penjual melampirkan '+s+' bukti sanggahan.':'Penjual belum melampirkan bukti sanggahan.');
 if(d.reason==='Barang tidak sampai'){
  if(t.deliveredDay!=null){rs.push('Resi kurir mencatat paket diterima di alamat tujuan, tetapi pembeli menyatakan belum menerima.');conf=58;}
  else if(t.resiFlag){rs.push('Resi tidak pernah terdeteksi kurir.');sug='refund';conf=74;}
  else{rs.push('Resi belum mencatat paket diterima.');conf=52;}
 }else if(d.reason==='Barang rusak'){
  if(b&&s){rs.push('Bukti kedua pihak saling bertentangan: kerusakan bisa terjadi saat pengiriman.');conf=54;}
  else if(b){rs.push('Hanya pembeli yang melampirkan bukti kerusakan.');sug='refund';conf=68;}
 }else if(d.reason==='Tidak sesuai deskripsi'){
  if(b&&!s){rs.push('Bukti pembeli menunjukkan perbedaan dengan deskripsi; penjual belum menyanggah.');sug='refund';conf=66;}
  else{rs.push('Perlu perbandingan foto produk dengan deskripsi tagihan.');conf=52;}
 }else conf=45;
 if(s&&!b){sug='release';conf=60;rs.push('Pembeli belum melampirkan bukti pendukung.');}
 if(d.extraSeller||d.extraBuyer){conf=Math.min(88,conf+12);rs.push('Bukti tambahan sudah diterima dan ikut dipertimbangkan.');if(sug==='more'&&b&&s){sug=d.reason==='Barang tidak sampai'?'release':'refund';}}
 return{sug:sug,conf:conf,rs:rs,sig:sig};
}
function aiAppeal(t){

 if(t.signals.length){sug='reject';conf=62;rs.push('Masih ada sinyal: '+t.signals.join(', ').toLowerCase()+'.');}
 else rs.push('Tidak ada sinyal risiko aktif dan resi valid. Riwayat penjual baik.');
 if(t.status!=='shipped'||t.resiFlag){sug='reject';conf=70;rs.push('Barang belum terbukti dikirim dengan resi valid, jadi dana belum bisa dicairkan.');}
 return{sug:sug,conf:conf,rs:rs,sig:t.signals.slice()};
}

function qrSvg(seed){
 let h=5381;for(let i=0;i<seed.length;i++)h=(h*33+seed.charCodeAt(i))>>>0;if(!h)h=1;
 const n=25,rnd=()=>{h^=h<<13;h>>>=0;h^=h>>>17;h^=h<<5;h>>>=0;return h/4294967296;};
 const inF=(x,y)=>(x<8&&y<8)||(x>n-9&&y<8)||(x<8&&y>n-9);let s='';
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){if(inF(x,y))continue;if(rnd()>.52)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1"/>';}
 const f=(ox,oy)=>'<path fill-rule="evenodd" d="M'+ox+' '+oy+'h7v7h-7zM'+(ox+1)+' '+(oy+1)+'v5h5v-5z"/><rect x="'+(ox+2)+'" y="'+(oy+2)+'" width="3" height="3"/>';
 return '<svg viewBox="-1 -1 27 27" class="qr" role="img" aria-label="Kode QRIS contoh"><g fill="currentColor">'+s+f(0,0)+f(n-7,0)+f(0,n-7)+'</g></svg>';
}

function lineChart(v,opt){
 const W=300,H=130,L=34,R=10,T=12,B=22,mn=opt.min,mx=opt.max,x=i=>L+i*(W-L-R)/(v.length-1),y=n=>T+(1-(n-mn)/(mx-mn))*(H-T-B);
 let g='',tk=[mn,(mn+mx)/2,mx];
 tk.forEach(k=>{g+='<line class="ch-g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(k)+'" y2="'+y(k)+'"/><text class="ch-t" x="'+(L-4)+'" y="'+(y(k)+3)+'" text-anchor="end">'+opt.f(k)+'</text>';});
 const pts=v.map((n,i)=>x(i)+','+y(n)).join(' ');
 const area='M'+x(0)+','+y(mn)+' L'+pts.replace(/ /g,' L')+' L'+x(v.length-1)+','+y(mn)+'Z';
 let ref='';if(opt.ref!=null)ref='<line class="ch-r" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(opt.ref)+'" y2="'+y(opt.ref)+'"/><text class="ch-t" x="'+(W-R)+'" y="'+(y(opt.ref)-4)+'" text-anchor="end">'+opt.refl+'</text>';
 const xl=opt.labels.map((l,i)=>i%2===0||i===v.length-1?'<text class="ch-t" x="'+x(i)+'" y="'+(H-6)+'" text-anchor="middle">'+l+'</text>':'').join('');
 const e=v.length-1;
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opt.aria+'">'+g+ref+'<path class="ch-a" d="'+area+'" opacity=".7"/><polyline class="ch-l" points="'+pts+'"/>'+xl+'<circle class="ch-e" cx="'+x(e)+'" cy="'+y(v[e])+'" r="4.5"/></svg>';
}
function barChart(v,opt){
 const W=300,H=130,L=34,R=10,T=12,B=22,mx=opt.max,n=v.length,bw=(W-L-R)/n,y=k=>T+(1-k/mx)*(H-T-B);
 let g='';[0,mx/2,mx].forEach(k=>{g+='<line class="ch-g" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(k)+'" y2="'+y(k)+'"/><text class="ch-t" x="'+(L-4)+'" y="'+(y(k)+3)+'" text-anchor="end">'+opt.f(k)+'</text>';});
 const bars=v.map((k,i)=>'<rect class="'+(i===n-1?'ch-b2':'ch-b')+'" x="'+(L+i*bw+bw*.18)+'" y="'+y(k)+'" width="'+(bw*.64)+'" height="'+(y(0)-y(k))+'" rx="3"/><text class="ch-t" x="'+(L+i*bw+bw/2)+'" y="'+(H-6)+'" text-anchor="middle">'+opt.labels[i]+'</text>').join('');
 return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+opt.aria+'">'+g+bars+'</svg>';
}

 if(r.height>window.innerHeight*.6){top=Math.max(16,window.innerHeight-240);}
 el.hidden=false;
 el.innerHTML='<div style="position:absolute;inset:0;background:rgba(3,10,20,.45)"></div><div class="tip" role="dialog" aria-label="Tur singkat" style="top:'+top+'px;left:'+left+'px"><div class="dots">'+TOUR.map((_,i)=>'<i class="'+(i===S.tour.i?'on':'')+'"></i>').join('')+'</div><h3>'+s.t+'</h3><p>'+s.p+'</p><div class="mrow"><button class="btn ghost sm" data-act="tourSkip" type="button">Lewati</button><button class="btn primary sm" data-act="tourNext" type="button">'+(S.tour.i===TOUR.length-1?'Selesai':'Lanjut')+'</button></div></div>';
 const b=el.querySelector('.btn.primary');if(b)b.focus();
}

/* ===== Aksi ===== */
function goto(role,tab){S.role=role;}
function checkCode(){
 const raw=String(S.f.code||'').trim().toUpperCase();
 if(!raw){S.codeErr='Masukkan kode tagihan dari penjual.';render();return;}
 const inv=S.invoices[raw];
 if(!inv){S.codeErr='Kode “'+raw+'” tidak ditemukan. Periksa ulang atau minta penjual mengirim kode baru.';render();return;}
 S.codeErr='';S.cur=inv;S.b.agree=false;S.b.loading=true;S.b.screen='invoice';render();
 setTimeout(()=>{S.b.loading=false;if(S.b.screen==='invoice')render();},750);
}
function checkProv(){
 const q=String(S.f.provider||'').trim();
 if(!q){S.provRes={ok:false,q:'(kosong)'};render();return;}
 const p=PROVIDERS.find(x=>x.n.toLowerCase()===q.toLowerCase());
 S.provRes=p?{ok:true,name:p.n,no:p.no,q:q}:{ok:false,q:q};render();
}
function doScan(){
 const l=$('#scanlayer');
 l.innerHTML='<div class="scan" role="dialog" aria-label="Pindai kode QR"><div class="fr"></div><p>Arahkan kamera ke kode QR penjual</p><p class="tiny" style="color:#9fb0c6">Simulasi, kamera tidak digunakan</p><button class="btn ghost sm" data-act="scanClose" type="button">Batal</button></div>';
 setTimeout(()=>{if(!l.firstChild)return;l.innerHTML='';S.f.code='RKB-7Q4M-2D9';S.codeErr='';render();toast('Kode terbaca: RKB-7Q4M-2D9','good');},1800);
}
function doDecide(v){
 const it=queueItems().find(i=>i.k===S.m.sel);if(!it)return;const t=it.t;
 if(it.k==='dispute'){
  if(v==='more'){t.dispute.extra=true;t.dispute.extraAsked=S.day;ev('Mediator meminta bukti tambahan dari kedua pihak.','med');toast('Bukti tambahan diminta dari kedua pihak','info');render();return;}
  ask({title:v==='release'?'Cairkan dana ke penjual?':'Kembalikan dana ke pembeli?',body:'<p class="mut">Keputusan ini final untuk transaksi '+t.id+' dan langsung terlihat di sisi pembeli dan penjual. Anda memutuskan sebagai mediator manusia, bukan AI.</p>',ok:v==='release'?'Ya, cairkan':'Ya, kembalikan',onOk:()=>{finish(v==='release'?'mediator_release':'mediator_refund');S.m.sel=null;render();}});
 }else{
  if(v==='more'){t.appeal.status='more';t.appeal.moreDay=S.day;ev('Mediator meminta bukti tambahan atas banding penjual.','med');toast('Bukti tambahan diminta dari penjual','info');render();return;}
  if(v==='reject'){t.appeal.status='rejected';t.appeal.note='Resi atau sinyal risiko masih perlu diselesaikan.';ev('Banding ditolak mediator. Dana tetap ditahan sesuai syarat.','med');S.m.sel=null;toast('Banding ditolak','warn');render();return;}
  ask({title:'Cairkan dana ke penjual?',body:'<p class="mut">Penahanan dinilai tidak terbukti, jadi dana dicairkan segera ke penjual.</p>',ok:'Ya, cairkan',onOk:()=>{t.appeal.status='accepted';finish('appeal_release');t.appeal.status='accepted';S.m.sel=null;render();}});
 }
}
function act(a,el,e){
 const v=el.dataset.v;
 switch(a){
 case 'role':S.role=v;render();break;
 case 'tab':if(S.role==='buyer'){S.b.screen=v;}else if(S.role==='seller'){S.s.tab=v;}else{S.m.tab=v;S.m.sel=null;}render();break;
 case 'sTab':S.s.tab=v;render();break;
 case 'goHome':S.b.screen='home';render();break;
 case 'goStatus':S.role='buyer';S.b.screen='status';render();break;
 case 'toInvoice':S.b.screen='invoice';render();break;
 case 'checkCode':checkCode();break;
 case 'fillCode':S.f.code=v;S.codeErr='';render();break;
 case 'scan':doScan();break;
 case 'scanClose':$('#scanlayer').innerHTML='';break;
 case 'fillProv':S.f.provider=v;checkProv();break;
 case 'checkProv':checkProv();break;
 case 'agree':S.b.agree=el.checked;render();break;
 case 'toPay':if(!S.b.agree)return;S.b.screen='pay';S.b.payStage='choose';render();break;
 case 'method':S.b.method=v;render();break;
 case 'payNext':S.b.payStage='wait';S.b.payT=600;render();break;
 case 'payBack':S.b.payStage='choose';render();break;
 case 'copyAcc':copy('880012345678','Nomor rekening');break;
 case 'simPay':S.b.payStage='processing';render();setTimeout(()=>{startTx();S.b.payStage='done';render();toast('Pembayaran berhasil. Dana ditahan.','good');},1500);break;
 case 'received':ask({title:'Barang sudah sampai?',body:'<p class="mut">Dana '+rp(S.tx.price)+' langsung dicairkan ke penjual dan tidak bisa ditarik kembali. Tekan hanya jika barang sudah di tangan Anda dan sesuai.</p>',ok:'Ya, cairkan dana',onOk:()=>{finish('buyer_confirm');render();}});break;
 case 'problem':S.b.reason='';S.b.files=[];S.b.err={};S.f.note='';S.b.screen='problem';render();break;
 case 'reason':S.b.reason=v;S.b.err={};render();break;
 case 'addfile':{const pool=['foto-kemasan-penyok.jpg','foto-kondisi-barang.jpg','video-unboxing.mp4','tangkapan-layar-chat.png'];const next=pool.find(x=>S.b.files.indexOf(x)<0);if(next){S.b.files.push(next);S.b.err={};}else toast('Maksimal 4 berkas pada prototipe ini','info');render();break;}
 case 'rmfile':S.b.files.splice(+el.dataset.i,1);render();break;
 case 'sendProblem':{const er={};if(!S.b.reason)er.reason='Pilih alasan keberatan terlebih dahulu.';if(!S.b.files.length)er.files='Unggah minimal satu foto atau video sebagai bukti.';S.b.err=er;if(Object.keys(er).length){render();return;}
  ask({title:'Kirim keberatan ke mediator?',body:'<p class="mut">Dana tetap ditahan. Mediator manusia memutuskan dalam 7 hari kerja setelah mengkaji bukti Anda dan penjual.</p>',ok:'Kirim',onOk:()=>{openDispute(S.b.reason,S.f.note,S.b.files);S.b.screen='status';render();toast('Keberatan terkirim ke mediator','info');}});break;}
 case 'extraBuyer':{const d=S.tx.dispute;d.extraBuyer=true;d.buyerFiles.push('foto-unboxing.jpg');ev('Pembeli menambahkan bukti: foto unboxing.','buyer');toast('Bukti tambahan terkirim','good');render();break;}
 case 'rate':S.b.rate=+v;render();break;
 case 'copyResi':copy(S.tx.resi,'Nomor resi');break;
 case 'copyProof':copy(S.tx.proof,'Nomor bukti');break;
 case 'newTx':S.past.push(S.tx);S.tx=null;S.cur=null;S.b=Object.assign(fresh().b);S.b.screen='home';S.provRes=null;render();break;
 case 'appeal':{const t=S.tx;ask({title:'Ajukan banding penahanan',body:'<label class="lbl" for="ap-r">Alasan banding</label><textarea id="ap-r" class="inp" placeholder="Contoh: barang sudah dikirim dengan resi valid."></textarea><p class="tiny">Mediator manusia memutuskan dalam 7 hari kerja. Jika penahanan tidak terbukti, dana dicairkan segera.</p>',ok:'Ajukan banding',onOk:()=>{const r=($('#ap-r')||{}).value||'Penahanan perlu ditinjau ulang.';t.appeal={status:'review',day:S.day,reason:r.trim()};ev('Penjual mengajukan banding penahanan.','seller');toast('Banding diajukan ke mediator','info');render();}});break;}
 case 'sellerEvidence':{const d=S.tx.dispute;if(d.extra&&!d.extraSeller){d.extraSeller=true;d.sellerFiles.push('tanda-terima-kurir.jpg');ev('Penjual menambahkan bukti: tanda terima kurir.','seller');}else{SELLER_FILES.forEach(f=>{if(d.sellerFiles.indexOf(f)<0)d.sellerFiles.push(f);});ev('Penjual mengunggah bukti sanggahan.','seller');}toast('Bukti terkirim ke mediator','good');render();break;}
 case 'fillInv':{const x={1:['Dompet Kulit Handmade','275000','Warna cokelat tua, kirim 1 hari kerja.'],2:['Mesin Espresso Rumahan','2500000','Lengkap dengan portafilter.'],3:['Sepatu Kulit Pria','95000','Ukuran 42, stok terbatas.']}[v];S.f.pname=x[0];S.f.pprice=x[1];S.f.pnote=x[2];S.s.err={};render();break;}
 case 'makeInv':{const er={},name=String(S.f.pname).trim(),price=parseInt(String(S.f.pprice).replace(/\D/g,''),10);
  if(!name)er.name='Isi nama barang.';
  if(!price||price<10000)er.price='Isi harga minimal Rp10.000, hanya angka.';
  else if(price>MAX_PRICE)er.price='Nilai melebihi batas tahap awal ('+rp(MAX_PRICE)+'). Turunkan harga atau pecah menjadi beberapa tagihan.';
  S.s.err=er;if(Object.keys(er).length){render();return;}
  const code=genCode(),inv={code:code,item:name,price:price,art:/earphone|headphone/i.test(name)?'ear':/tas|dompet|batik/i.test(name)?'bag':'box',note:String(S.f.pnote||'').trim()};
  S.invoices[code]=inv;S.s.created=inv;toast('Tagihan dibuat','good');render();break;}
 case 'copyCode':copy(S.s.created.code,'Kode tagihan');break;
 case 'copyLink':copy('https://rekber.example/bayar/'+S.s.created.code,'Tautan');break;
 case 'copyWA':{const c=S.s.created;copy('Halo! Untuk '+c.item+' ('+rp(c.price)+') saya pakai Rekber Resmi, jadi dana Anda ditahan penyedia berizin sampai barang sampai. Cek syaratnya dan bayar di: https://rekber.example/bayar/'+c.code+' (kode '+c.code+')','Pesan WhatsApp');break;}
 case 'asBuyer':S.f.code=S.s.created.code;S.role='buyer';S.b.screen='home';S.codeErr='';render();break;
 case 'newInv':S.s.created=null;S.f.pname='';S.f.pprice='';S.f.pnote='';S.s.err={};render();break;
 case 'fillResi':S.f.resi=v;S.s.err={};render();break;
 case 'saveResi':{const r=String(S.f.resi).trim().toUpperCase();if(!/^[A-Z0-9]{8,16}$/.test(r)){S.s.err={resi:'Nomor resi harus 8 sampai 16 huruf atau angka, tanpa spasi.'};render();return;}S.s.err={};ship(r);S.f.resi='';S.s.tab='dash';render();break;}
 case 'copyLabel':copy('✔ Rekber Resmi – '+SELLER.name+' menerima pembayaran lewat rekening bersama berizin. Dana Anda ditahan sampai barang sampai. Cek legalitas: rekber.example/cek','Teks label');break;
 case 'mSel':S.m.sel=v;render();break;
 case 'mBack':S.m.sel=null;render();break;
 case 'decide':doDecide(v);break;
 case 'seedDispute':seedDispute();render();toast('Sengketa contoh dimuat. Anda di peran Mediator.','info');break;
 case 'scn':S.scenario=v;render();toast('Skenario '+v+': '+SCN[v][0],'info');break;
 case 'adv':advance(+v);break;
 case 'skipPay':{const keep={role:'buyer',scenario:S.scenario};reset(keep);quickPay();render();toast('Pembayaran disimulasikan. Dana ditahan.','good');break;}
 case 'startTour':S.tour={on:true,i:0};renderTour();break;
 case 'reset':reset({});S.tour.on=false;render();renderTour();toast('Demo direset','info');break;
 case 'tourSkip':S.tour.on=false;renderTour();break;
 case 'tourNext':if(S.tour.i>=TOUR.length-1){S.tour.on=false;}else S.tour.i++;renderTour();break;
 case 'mclose':closeModal();break;
 case 'mok':{const cb=modalCb;closeModal();if(cb)cb();break;}
 }
}
/* appeal 'more' kembali ke antrian setelah satu hari kerja */
const _adv=advance;
advance=function(n){for(let i=0;i<n;i++){dayTick();const t=S.tx;if(t&&t.appeal&&t.appeal.status==='more'&&S.day>t.appeal.moreDay){t.appeal.status='review';ev('Penjual melengkapi bukti banding.','seller');}}render();toast('Maju '+n+' hari kerja → '+fshort(S.day),'info');};

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
 if(el.type==='checkbox'){act(el.dataset.act,el,e);return;}
 e.preventDefault();act(el.dataset.act,el,e);
});
document.addEventListener('input',e=>{const b=e.target.dataset&&e.target.dataset.bind;if(b){S.f[b]=e.target.value;if(b==='code')S.codeErr='';}});
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter&&e.target.tagName==='INPUT'){e.preventDefault();act(e.target.dataset.enter,e.target,e);}
 if(e.key==='Escape'){if(!$('#modal').hidden)closeModal();else if(S.tour.on){S.tour.on=false;renderTour();}else if($('#demo').classList.contains('open'))toggleDemo(false);}
});
function toggleDemo(on){const d=$('#demo'),s=$('#scrim'),f=$('#fab');d.classList.toggle('open',on);s.hidden=!on;s.className=on?'scrim':'';f.setAttribute('aria-expanded',on?'true':'false');}
$('#fab').addEventListener('click',()=>toggleDemo(!$('#demo').classList.contains('open')));
$('#scrim').addEventListener('click',()=>toggleDemo(false));
window.addEventListener('resize',()=>{if(S.tour.on)renderTour();});
setInterval(()=>{if(S.role==='buyer'&&S.b.screen==='pay'&&S.b.payStage==='wait'){S.b.payT=Math.max(0,S.b.payT-1);const t=$('#tmr');if(t)t.textContent=mmss(S.b.payT);}},1000);

/* ===== Mulai ===== */
render();
setTimeout(renderTour,300);
})();
</script>

</body></html>
